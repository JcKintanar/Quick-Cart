<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - Quick Cart</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Lato&display=swap" rel="stylesheet">
</head>
<body style="font-family: 'Lato', sans-serif; background-color: #f7f7f7;">

<nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #90ee90;">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="index.html">Quick Cart</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
  </div>
</nav>

<section class="d-flex align-items-center justify-content-center vh-100">
  <div class="card p-4 shadow-sm" style="width: 350px;">
    <h3 class="text-center fw-bold mb-3" style="font-family: 'Montserrat', sans-serif;">Sign Up</h3>
    <form>
      <div class="mb-3">
        <label for="fullname" class="form-label">Full Name</label>
        <input type="text" class="form-control rounded-pill" id="fullname" placeholder="John Doe" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email address</label>
        <input type="email" class="form-control rounded-pill" id="email" placeholder="Enter email" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control rounded-pill" id="password" placeholder="Password" required>
      </div>
      <div class="mb-3">
        <label for="confirmPassword" class="form-label">Confirm Password</label>
        <input type="password" class="form-control rounded-pill" id="confirmPassword" placeholder="Confirm Password" required>
      </div>
      <button type="submit" class="btn btn-success w-100 rounded-pill mb-2">Create Account</button>
      <div class="text-center">
        <a href="loginpage.html">Already have an account? Login</a>
      </div>
    </form>
  </div>
</section>

<footer class="text-white text-center py-4" style="background-color: #90ee90;">
  <p>&copy; 2025 Quick Cart. All rights reserved.</p>
  <p>
    <a href="https://www.facebook.com" class="text-dark me-3">Facebook</a>
    <a href="https://www.instagram.com/?hl=en" class="text-dark me-3">Instagram</a>
    <a href="https://x.com" class="text-dark">Twitter</a>
  </p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
